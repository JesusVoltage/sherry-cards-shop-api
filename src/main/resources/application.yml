spring:
  application:
    name: sherry-cards-shop-api
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 50
    # Lee entera una subida demasiado grande para poder responder 413 en vez de cortar la conexión.
    max-swallow-size: 10MB
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
app:
  site:
    closed: ${APP_SITE_CLOSED:false}
  storage:
    endpoint: ${R2_ENDPOINT:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}
    max-image-size: 5MB
    max-total-size: 9GB
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-login-failures: 5
    login-lockout: 15m
    breached-password-check: ${APP_AUTH_BREACHED_PASSWORD_CHECK:true}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

---
spring:
  config:
    activate:
      on-profile: dev
app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:false}
logging:
  level:
    com.sherrycardsshop.api: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:sherry_cards_shop;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
app:
  auth:
    jwt-secret: test-only-secret-0123456789abcdef0123456789
    breached-password-check: false
    google:
      client-id: test-google-client-id

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  level:
    root: INFO
    com.sherrycardsshop.api: INFO